name: Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write

jobs:
  # Job 0: resolve the version once (tag -> 1.2.3, branch -> 0.0.0-dev)
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.res.outputs.version }}
      is_release: ${{ steps.res.outputs.is_release }}
    steps:
      - name: Resolve version
        id: res
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 1: Build binaries for all platforms
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            target: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            target: windows-x64
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary (cross-compile)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUT=gix-${{ matrix.target }}${{ matrix.ext }}
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/m-mdy-m/gix/internal/commands.Version=${{ needs.version.outputs.version }}'" \
            -o "build/$OUT" ./cmd/gix
        shell: bash

      - name: Create checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd build
          OUT=gix-${{ matrix.target }}${{ matrix.ext }}
          sha256sum "$OUT" > "$OUT.sha256"
        shell: bash

      - name: Create checksum (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = "gix-${{ matrix.target }}${{ matrix.ext }}"
          $hash = (Get-FileHash -Algorithm SHA256 "build\$out").Hash.ToLower()
          "$hash  $out" | Out-File -Encoding ASCII "build\$out.sha256"
        shell: pwsh

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd build
          OUT=gix-${{ matrix.target }}${{ matrix.ext }}
          tar -czf gix-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz "$OUT"
        shell: bash

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = "gix-${{ matrix.target }}${{ matrix.ext }}"
          Compress-Archive -Path "build\$out" -DestinationPath "build\gix-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
        shell: pwsh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            build/gix-${{ needs.version.outputs.version }}-${{ matrix.target }}.*
            build/gix-${{ matrix.target }}*.sha256
          if-no-files-found: error
          retention-days: 7

  # Job 2: Create GitHub Release and upload binaries (tags only)
  create-release:
    name: Create Release
    needs: [version, build-binaries]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binary-*
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd binaries
          # keep individual .sha256 files (install.sh downloads them)
          # and also publish one combined list
          cat *.sha256 > checksums.txt
          ls -lh

      - name: Extract release notes
        id: extract_notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          else
            echo "Release ${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.version }}
          body_path: release_notes.md
          files: binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Build and publish Docker image (tags only)
  publish-docker:
    name: Publish Docker Image
    needs: [version, create-release]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bitsgenix/gix
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
