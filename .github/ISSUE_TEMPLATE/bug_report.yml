name: Bug report
description: Something in the flow commands didn't do what it should
title: "[bug] "
labels: ["bug"]

body:
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact gix command (and relevant flags) you ran.
      placeholder: gix feature finish api-auth
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Minimal steps to reproduce, if not obvious from the command above.

  - type: input
    id: gix-version
    attributes:
      label: gix version
      placeholder: output of `gix --version`