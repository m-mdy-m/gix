name: Feature request
description: Suggest a command or behavior for gix
title: "[feature] "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What part of the flow does this help with?
      description: gix models one specific flow (main/develop/feature/release) — say where this fits.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed command or behavior
    validations:
      required: true